services:
  - type: web
    name: zephyrix
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.5
      - key: SESSION_PEPPER
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ZEGO_APP_ID
        sync: false
      - key: ZEGO_SERVER_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://zephyrixchat.vercel.app
      - key: CORS_ORIGIN
        value: https://zephyrixchat.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: When DATABASE_URL is unset, Zephyrix falls back to local SQLite.
      # For paid plans with a Render Persistent Disk mounted at /var/data,
      # uncomment DATA_DIR and disk below so uploads (and SQLite if used) persist:
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: zephyrix-data
    #   mountPath: /var/data
    #   sizeGB: 5
